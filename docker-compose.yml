services:
  db:
    image: postgres:16-alpine
    container_name: eduoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduoo_db}
      POSTGRES_USER: ${POSTGRES_USER:-eduoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduoo_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduoo_user} -d ${POSTGRES_DB:-eduoo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduoo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduoo_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-eduoo-development-key-change-in-production-12345}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduoo_user}:${POSTGRES_PASSWORD:-eduoo_secure_pass}@db:5432/${POSTGRES_DB:-eduoo_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER:-fallback}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduoo_celery_worker
    restart: unless-stopped
    command: celery -A eduoo worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-eduoo-development-key-change-in-production-12345}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduoo_user}:${POSTGRES_PASSWORD:-eduoo_secure_pass}@db:5432/${POSTGRES_DB:-eduoo_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduoo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
